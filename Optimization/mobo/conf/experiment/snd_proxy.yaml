# First experiment: validate the whole loop on proxy objectives.
#
# Maximize the SiPad hit count against a proxy cost. Both are cheap and
# well-understood, which is the point — the physics objectives (tracking
# efficiency and resolution from ACTSTracks) plug into the same machinery later
# by adding keys to metrics.json and naming them here.
name: snd_proxy

# Ranges around the committed baseline: this is a test of the framework, not
# the final optimization. The baseline must fall inside the box (asserted in
# tests/ship/test_geometry.py), since trial 0 reproduces it exactly.
parameters:
  SiPad_WThickness:    { low: 10.0, high: 30.0 }             # mm, baseline 10
  SiPad_dim_z:         { low: 220,  high: 1000 }             # mm, baseline 220
  #  SiTarget_dim_z = SiDetector_total_dim_z - SiPad_dim_z (2200 mm), so this one
  #  moves both detectors: at the top of the range the SiTarget is left 1200 mm,
  #  still ample for 120 layers of its thickest absorber (912 mm).
  SiPad_NLayers:       { low: 10,   high: 20,  kind: int }   # baseline 10
  SiTarget_WThickness: { low: 2.0,  high: 5.0 }              # mm, baseline 3.5
  SiTarget_NLayers:    { low: 80,   high: 120, kind: int }   # baseline 120
  SiTarget_XY_plane_gap_frac: { low: 0.0, high: 1.0 }        # baseline 1
# Layer counts are searched directly, as integers. They used to be fill
# fractions because their upper bound moved with the other parameters; now both
# layer gaps are `auto`, the pitch is dim_z/NLayers, and a count is bounded only
# by the rigid content of a layer — a bound the box stays inside except in the
# far corner (many thick SiPad layers in a short envelope), which the dry-run
# gate rejects before anything is queued.
#
# SiTarget_spacing is gone. It was never independent: a SiTarget layer *is* the
# W-to-W pitch, so the spacing only ever decided how much dead air each layer
# carried, and it cost nothing in the objectives — a nuisance dimension. It is
# now an output, SiTarget_dim_z / SiTarget_NLayers.
#
# SiTarget_XY_plane_gap_frac is a fraction because its budget is genuinely
# derived: the air a layer has left once the pitch is fixed. 0 puts the Y plane
# against the X plane, 1 against the W of the next layer; the baseline is 1, so
# it sits on the upper edge of its range. It is a *template* constant now, not
# something this layer maps onto a length — the interpolation happens where the
# budget is defined (SND_compact_template.xml), which is also what makes the
# whole [0, 1] interval feasible by construction rather than by arithmetic done
# twice in two places.

# Held at the baseline to keep the space at 7D. Purely mechanical quantities;
# freeing one is a two-line change here, no code.
fixed:
  SiPad_frame_gap: 0.1
  SiTarget_module_offset: 1
  # config.py sizes both so the layers of each detector come out equidistant and
  # span their envelope exactly. This is what makes NLayers the sampling-pitch
  # knob, and what removed SiTarget_spacing from the search space.
  SiPad_layer_gap: auto
  SiTarget_layer_gap: auto

# The optimized subset of metrics.json. Everything else is still recorded.
# ref_from_baseline: the worst value still worth having, as a multiple of what
# the baseline scores — anchored once trial 0 completes, then never recomputed.
objectives:
  - { name: nhits_sipad, direction: max, ref_from_baseline: 0.5 }
  - { name: cost_proxy,  direction: min, ref_from_baseline: 2.0 }

loop:
  max_trials: 20
  max_in_flight: 4
  batch_ask: 1
  poll_interval: 30
  max_retries: 1
  baseline_first: true       # trial 0 is the baseline geometry
  time_budget_hours: null
