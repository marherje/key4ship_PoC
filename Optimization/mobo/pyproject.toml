[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobo"
version = "0.1.0"
description = "Asynchronous multi-objective Bayesian optimization loop for detector geometry"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SHiP SND geometry optimization" }]

# Loose lower bounds on purpose: the venv is created with
# --system-site-packages over the key4hep python, which already ships numpy,
# scipy, pandas and matplotlib. Pinning them tighter would make pip reinstall
# multi-hundred-MB wheels into an AFS volume that has no room for them.
dependencies = [
    "torch>=2.2",
    "botorch>=0.12",
    "gpytorch>=1.13",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "plotly>=5.20",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    # Not imported by us: botorch JIT-compiles a fused qLogEHVI kernel on first
    # use and needs pybind11's headers to do it. Without them it warns loudly
    # and falls back to a ~3x slower pure-python path.
    "pybind11>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.10",
    # mypy still imports pathspec.patterns.gitignore, which pathspec 1.0 moved.
    # Unpinned, pip resolves to 1.x and mypy fails to start.
    "pathspec<1",
    "pre-commit>=3.7",
]

[project.scripts]
mobo-run = "mobo.cli:run"
mobo-resume = "mobo.cli:resume"
mobo-status = "mobo.cli:status"
mobo-report = "mobo.cli:report"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# key4hep puts Gaudi's own pytest plugin on the path; it wraps every test in
# CTest/Dart XML measurements and makes the output unreadable.
addopts = "-p no:GaudiTesting"
markers = [
    "slow: takes minutes (GP fits, full simulations)",
    "key4hep: needs the key4hep stack (ROOT, ddsim, k4run)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # botorch JIT-compiles a fused qLogEHVI kernel on first use. When the build
    # fails it falls back to an equivalent (about 3x slower) pure-python path
    # and warns with the whole compiler transcript, which buries the test output.
    "ignore:Failed to compile fused qLogEHVI:UserWarning",
]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",   # function call in default argument: fine for our dataclass factories
    "SIM108", # ternary-vs-if is a readability call, not a rule
]

[tool.ruff.lint.per-file-ignores]
# The payload runs on a worker node with the bare key4hep python and may not
# import the package, so a few stdlib-only idioms differ from the rest.
"src/mobo/ship/payload.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# ROOT, DD4hep and the geometry helpers are imported dynamically by path.
module = ["mobo.ship.*", "mobo.viz.*", "mobo.cli"]
disallow_untyped_defs = false
