# Install once with:  pre-commit install  (from Optimization/mobo/)
#
# mypy is deliberately not a hook here: it needs the venv ahead of key4hep on
# PYTHONPATH (see check.sh), which pre-commit's isolated environments cannot
# reproduce. Run `bash check.sh` for the full pass.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=512]
